name: Conditional Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  APP_NAME: demo-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Print target
        if: ${{ inputs.environment == 'production' }}
        run: echo "SIMULATED PROD DEPLOY only for production"

      - name: Print staging target
        if: ${{ inputs.environment == 'staging' }}
        run: echo "Deploying to staging"

      - name: Guarded step
        if: ${{ env.APP_NAME == 'demo-app' }}
        run: echo "guard passed"

      - name: Notify
        if: ${{ always() }}
        run: echo "finished"
