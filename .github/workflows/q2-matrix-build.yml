name: Matrix Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04

        node:
          - 18
          - 20

        exclude:
          - os: ubuntu-22.04
            node: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-${{ matrix.node }}
          restore-keys: |
            npm-${{ runner.os }}-node-${{ matrix.node }}-

      - name: Print Node and npm versions
        run: |
          node --version
          npm --version

      - name: Create report
        run: |
          mkdir -p out
          echo "Runner OS: ${{ runner.os }}" > "out/report-${{ matrix.os }}-${{ matrix.node }}.txt"
          echo "Node version: $(node --version)" >> "out/report-${{ matrix.os }}-${{ matrix.node }}.txt"
          echo "Run number: ${{ github.run_number }}" >> "out/report-${{ matrix.os }}-${{ matrix.node }}.txt"

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.node }}
          path: out/report-${{ matrix.os }}-${{ matrix.node }}.txt

  collect:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Print report contents
        run: |
          find all-reports -type f -print

          find all-reports -type f -exec sh -c '
            echo "===== $1 ====="
            cat "$1"
            echo
          ' _ {} \;
