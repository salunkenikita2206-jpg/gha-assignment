name: Release Notes
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: "1.0.0"
        type: string

      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      build_tag: ${{ steps.meta.outputs.build_tag }}
      build_date: ${{ steps.meta.outputs.build_date }}

    steps:
      - name: Compute build tag and date
        id: meta
        run: |
          BUILD_TAG="${{ inputs.version }}-${{ inputs.release_type }}-${{ github.run_number }}"
          BUILD_DATE="$(date +%F)"

          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

  announce:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Print outputs
        run: |
          echo "Build tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build date: ${{ needs.prepare.outputs.build_date }}"

      - name: Write summary
        run: |
          echo "## Release Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ inputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release type | ${{ inputs.release_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build tag | ${{ needs.prepare.outputs.build_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build date | ${{ needs.prepare.outputs.build_date }} |" >> "$GITHUB_STEP_SUMMARY"
